spring.application.name=shoe-shop
spring.datasource.url=jdbc:mysql://localhost:3306/shoeshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Change from create-drop to update for more reliable table creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Add these lines to show more SQL details
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable flyway for now since we're using hibernate to manage schema
spring.flyway.enabled=false

spring.security.admin.name=admin
spring.security.admin.password=admin
spring.security.admin.email=admin@example.com

jwt.secret=cTB7iYz+tmwmy5+pM9Z4cj+fXUl8RMLezvcN0xEzNkk=
jwt.expiration=86400000

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html

# Swagger UI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Currency API Configuration
currency.api.url=https://api.exchangerate-api.com/v4/latest/USD

# Redis Configuration
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.redis.time-to-live=3600000
